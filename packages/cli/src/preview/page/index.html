<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Preview · Agent Zero</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231d1d1f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/__agnt0/preview.css">
<!--AGNT0_STATE-->
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div class="titles">
      <div class="project" id="project">Preview</div>
      <div class="meta"><span class="dot" id="dot"></span><span id="status">Starting</span><span class="sep">·</span><span id="framework"></span><span class="sep">·</span><a id="target" target="_blank" rel="noopener"></a></div>
    </div>
  </div>

  <div class="seg" role="tablist" aria-label="Device">
    <button role="tab" data-device="mobile" aria-selected="true">Mobile</button>
    <button role="tab" data-device="tablet" aria-selected="false">Tablet</button>
    <button role="tab" data-device="desktop" aria-selected="false">Desktop</button>
  </div>

  <div class="tools">
    <form class="path" id="path-form" autocomplete="off">
      <input id="path" value="/" spellcheck="false" aria-label="Path">
    </form>
    <button class="icon" id="rotate" title="Rotate (R)" aria-label="Rotate">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="3" width="11" height="18" rx="2.5"/><path d="M20.5 9.5a8 8 0 0 0-3-5"/><path d="M3.5 14.5a8 8 0 0 0 3 5"/></svg>
    </button>
    <button class="icon" id="reload" title="Reload app" aria-label="Reload">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg>
    </button>
    <a class="icon" id="open" title="Open in a new tab" aria-label="Open in a new tab" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4.5h5.5V10"/><path d="M19.5 4.5 11 13"/><path d="M17.5 14v4a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 18V8A1.5 1.5 0 0 1 6 6.5h4"/></svg>
    </a>
  </div>
</header>

<main class="stage" id="stage">
  <div class="canvas" id="canvas">
    <div class="sizer" id="sizer">
      <div class="device mobile" id="device">
        <div class="chrome" aria-hidden="true"><i></i><i></i><i></i><span id="chrome-url"></span></div>
        <div class="screen">
          <iframe id="frame" title="App preview" allow="clipboard-read; clipboard-write; geolocation; camera; microphone"></iframe>
          <div class="overlay" id="overlay"><div class="spinner"></div><div id="overlay-text">Waiting for the dev server…</div></div>
        </div>
      </div>
    </div>
    <div class="caption" id="caption"></div>
  </div>

  <aside class="expo" id="expo" hidden>
    <div class="qr" id="qr"></div>
    <div class="expo-title">Open on your phone</div>
    <p>Scan with the Camera app on iPhone or with Expo Go on Android. Your phone needs to be on the same network.</p>
    <code id="expo-url"></code>
  </aside>
</main>

<script src="/__agnt0/preview.js"></script>
</body>
</html>
